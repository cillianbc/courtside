name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        # Once testdata/ is a private submodule, add:
        #   with: { submodules: true, token: ${{ secrets.CORPUS_TOKEN }} }
        # and set COURTSIDE_REQUIRE_CORPUS: 1 on the test step.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # WebAssembly build of courtside-ffi (task 8) and a Node smoke test on a
  # made-up fixture. The corpus comparison with the CLI runs locally.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo clippy --target wasm32-unknown-unknown -p courtside-ffi -- -D warnings
      - run: tools/wasm/build.sh
      - run: node tools/wasm/smoke.mjs

  # Parity against openvolley (PRD I-03). Needs the private corpus, so it is
  # off until the testdata submodule exists and the repo variable
  # CORPUS_AVAILABLE is set to "true".
  parity:
    if: ${{ vars.CORPUS_AVAILABLE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.CORPUS_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: tools/parity/run.sh
      - run: cargo test -p dvw-codec -p vb-grammar -p vb-engine --test parity
        env:
          COURTSIDE_REQUIRE_PARITY: "1"

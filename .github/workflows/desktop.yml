name: Desktop app

# Installers that need nothing else installed (video included,
# docs/adr/0004): a .dmg for macOS (Apple silicon), an .exe installer for
# Windows. Run by hand for now; app releases (app-v* tags) come later.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Crash reports go to Sentry only with a DSN in the build (diagnostics.rs).
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

jobs:
  macos:
    # The bundled libraries are Homebrew's for this macOS, so the app runs
    # on it and later.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: brew install mpv dylibbundler
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - run: tools/bundle/macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: courtside-macos
          path: target/release/bundle/dmg/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: ilammy/msvc-dev-cmd@v1
      # libmpv for Windows: shinchiro's mpv-winbuild-cmake development
      # package (libmpv-2.dll and headers). MSVC's import library is made
      # from the DLL's export list; the DLL goes beside the app (the
      # --config on the build).
      - name: libmpv
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = gh release view --repo shinchiro/mpv-winbuild-cmake --json assets `
            --jq '.assets[] | select(.name | test("^mpv-dev-x86_64-[0-9]")) | .name' | Select-Object -First 1
          gh release download --repo shinchiro/mpv-winbuild-cmake --pattern $asset --dir mpv
          7z x "mpv/$asset" -ompv -y | Out-Null
          $dll = Get-ChildItem mpv -Recurse -Filter 'libmpv*.dll' | Select-Object -First 1
          if (-not $dll) { Get-ChildItem mpv -Recurse | Select-Object FullName; exit 1 }
          $names = dumpbin /nologo /exports $dll.FullName |
            Select-String '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]{8}\s+(\S+)' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          if ($names.Count -lt 50) { "only $($names.Count) exports found"; exit 1 }
          (@("LIBRARY $($dll.BaseName)", "EXPORTS") + $names) | Set-Content mpv/mpv.def
          lib /nologo /def:mpv/mpv.def /out:mpv/mpv.lib /machine:x64
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/libmpv | Out-Null
          Copy-Item $dll.FullName apps/desktop/src-tauri/libmpv/libmpv-2.dll
          # Third-party notices (GPL: the source must be available): which
          # build is inside, where its source is, the written offer, and
          # mpv's and FFmpeg's licences (docs/THIRD-PARTY.md).
          $tag = gh release view --repo shinchiro/mpv-winbuild-cmake --json tagName --jq .tagName
          $mpv = if ($asset -match 'git-([0-9a-f]+)') { $Matches[1] } else { 'unknown' }
          $notice = 'apps/desktop/src-tauri/libmpv/third-party'
          New-Item -ItemType Directory -Force $notice | Out-Null
          @(
            "Courtside: third-party software bundled for video playback",
            "",
            "Courtside (AGPL-3.0-only) plays video with libmpv-2.dll, an unmodified build",
            "from shinchiro/mpv-winbuild-cmake. It contains mpv (GPL-2.0-or-later) and",
            "FFmpeg and its libraries (GPL-3.0-or-later as built), statically linked.",
            "",
            "Build:      $asset",
            "Release:    https://github.com/shinchiro/mpv-winbuild-cmake/releases/tag/$tag",
            "Recipe:     https://github.com/shinchiro/mpv-winbuild-cmake (the build scripts and",
            "            the exact versions of every library, at that release)",
            "mpv source: https://github.com/mpv-player/mpv/commit/$mpv",
            "",
            "Written offer: for three years from the release of this copy of Courtside, the",
            "Courtside project will provide the complete corresponding source code of this",
            "build on request, at no more than the cost of providing it. Write to the",
            "address in https://github.com/cillianbc/courtside/blob/main/docs/THIRD-PARTY.md."
          ) | Set-Content "$notice/THIRD-PARTY-NOTICES.txt"
          Invoke-WebRequest https://raw.githubusercontent.com/mpv-player/mpv/master/LICENSE.GPL -OutFile "$notice/mpv-LICENSE.GPL"
          Invoke-WebRequest https://raw.githubusercontent.com/FFmpeg/FFmpeg/master/COPYING.GPLv3 -OutFile "$notice/ffmpeg-COPYING.GPLv3"
          Copy-Item LICENSE "$notice/Courtside-LICENSE"
          # A file, not inline JSON: PowerShell drops the quotes it passes on.
          '{"bundle":{"resources":{"libmpv/libmpv-2.dll":"libmpv-2.dll","libmpv/third-party/*":"third-party/"}}}' |
            Set-Content apps/desktop/src-tauri/libmpv/windows.conf.json
          "MPV_LIB_DIR=$PWD\mpv" | Out-File -FilePath $env:GITHUB_ENV -Append
          "libmpv: $asset" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - run: pnpm tauri build --bundles nsis --config src-tauri/libmpv/windows.conf.json
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: courtside-windows
          path: target/release/bundle/nsis/*.exe

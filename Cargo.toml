[workspace]
resolver = "3"
members = ["crates/dvw-codec", "crates/vb-grammar", "crates/courtside-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
repository = "https://github.com/cillianbc/courtside"
homepage = "https://github.com/cillianbc/courtside-cli"
publish = false

[workspace.dependencies]
dvw-codec = { path = "crates/dvw-codec" }
vb-grammar = { path = "crates/vb-grammar" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
encoding_rs = "0.8"
insta = "1"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
toml = "0.9"
winnow = "0.7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package]
name = "courtside-desktop"
description = "Courtside desktop app: the Tauri shell around the coding console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[package.metadata.dist]
dist = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
courtside-console.workspace = true
log = "0.4.34"
# FIVB VIS requests (issue #60); the same reqwest and TLS Sentry uses.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sentry = { version = "0.46.2", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2.9.2"
tauri-plugin-opener = "2.5.5"
vb-scoresheet.workspace = true
vb-vis.workspace = true

# Video: libmpv drawn into a native view over the video panel
# (docs/adr/0004). The platform crates are the versions Tauri uses, so the
# window handles it hands over are the same types.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
libmpv2 = "6"

# macOS: mpv no longer embeds in a view (`wid`) since 0.37, so it renders
# through its render API into our own CAOpenGLLayer.
[target.'cfg(target_os = "macos")'.dependencies]
libmpv2-sys = "4"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSView", "NSResponder", "NSWindow", "NSGraphics", "objc2-quartz-core"] }
objc2-core-foundation = { version = "0.3", features = ["CFDate"] }
objc2-core-video = { version = "0.3", features = ["CVBase"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
objc2-open-gl = { version = "0.3", features = ["CGLTypes", "CGLCurrent"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAOpenGLLayer", "CAMediaTiming", "objc2-open-gl", "objc2-core-video", "objc2-core-foundation"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdkx11 = "0.18"
x11-dl = "2.21"

# The workspace's lints, except that `unsafe` is denied rather than
# forbidden: the video module needs a few AppKit calls (allowed there only).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

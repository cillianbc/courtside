[package]
name = "courtside-desktop"
description = "Courtside desktop app: the Tauri shell around the coding console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[package.metadata.dist]
dist = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
courtside-console.workspace = true
serde.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

# Video: libmpv drawn into a native view over the video panel
# (docs/adr/0004). The platform crates are the versions Tauri uses, so the
# window handles it hands over are the same types.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
libmpv2 = "6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSView", "NSResponder", "NSWindow", "NSGraphics"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdkx11 = "0.18"
x11-dl = "2.21"

# The workspace's lints, except that `unsafe` is denied rather than
# forbidden: the video module needs a few AppKit calls (allowed there only).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-pc-windows-msvc", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
# Users mostly have no Rust toolchain, so not CARGO_HOME
install-path = ["$XDG_BIN_HOME/", "$XDG_DATA_HOME/../bin", "~/.local/bin"]
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Source stays private; releases are published to this public repo
github-releases-repo = "cillianbc/courtside-cli"
# Never attach a source archive: the source is private
source-tarball = false
# Homebrew: brew install cillianbc/tap/courtside
tap = "cillianbc/homebrew-tap"
formula = "courtside"
publish-jobs = ["homebrew"]
